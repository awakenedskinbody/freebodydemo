# Static site: no build step, publish the repo root.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Tools kept in the repo for the team (Apps Script for the December sheet), not part of the site
[[redirects]]
  from = "/tools/*"
  to = "/"
  status = 404
  force = true
